name: security-audit-strict

# Strict dependency audit: no interim CVE ignores. Intended for scheduled / manual
# margin checks. See docs/SECURITY_CONTINUITY.md for interim posture on PRs.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC

permissions:
  contents: read

jobs:
  pip-audit-strict:
    name: pip-audit strict (OSV, no ignores)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Export locked requirements
        run: uv export --all-groups --format requirements.txt --no-hashes -o /tmp/python-craft-reqs.txt

      - name: pip-audit (OSV, strict)
        id: pip_audit
        run: |
          set -o pipefail
          uv tool run pip-audit -r /tmp/python-craft-reqs.txt --skip-editable -s osv -f markdown | tee pip-audit-strict.md

      - name: Bandit (weekly digest, advisory)
        if: always()
        continue-on-error: true
        run: uv tool run bandit -r src/craft -ll -f txt | tee bandit-weekly.txt

      - name: Upload pip-audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-strict
          path: pip-audit-strict.md

      - name: Upload Bandit digest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-weekly
          path: bandit-weekly.txt
          if-no-files-found: ignore

      - name: Post job summary (scheduled ops digest)
        if: always()
        env:
          DOC_URL: ${{ format('{0}/{1}/blob/{2}/docs/SECURITY_CONTINUITY.md', github.server_url, github.repository, github.sha) }}
          ROUTINE_URL: ${{ format('{0}/{1}/blob/{2}/docs/OPS_SCHEDULED_ROUTINE.md', github.server_url, github.repository, github.sha) }}
        run: |
          {
            echo "## Scheduled ops digest — python-craft"
            echo ""
            echo "| Item | Detail |"
            echo "|------|--------|"
            echo "| UTC | $(date -u '+%Y-%m-%d %H:%M') |"
            echo "| Workflow | \`security-audit-strict.yml\` |"
            echo "| pip-audit step | ${{ steps.pip_audit.outcome }} |"
            echo "| Ops routine (human cadence) | [OPS_SCHEDULED_ROUTINE.md](${ROUTINE_URL}) |"
            echo "| Security margin | [SECURITY_CONTINUITY.md](${DOC_URL}) |"
            echo "| Artifacts | \`pip-audit-strict\`, \`bandit-weekly\` |"
            echo ""
            if [[ -f pip-audit-strict.md ]]; then
              echo "### pip-audit strict (excerpt)"
              echo ""
              echo '```'
              head -n 50 pip-audit-strict.md
              echo '```'
              echo ""
            fi
            if [[ -f bandit-weekly.txt ]]; then
              echo "### Bandit (excerpt)"
              echo ""
              echo '```'
              head -n 40 bandit-weekly.txt
              echo '```'
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
